name: CI

# Unit + typecheck gate for @turnwrk/shared. Tests only — never deploys.
# This package is the dependency root of the suite; keep it green first.
# Draft PRs run nothing. The board loop opens every PR as a draft and marks it ready
# only when the card is finished and `bin/validate` passed locally — and local validation
# now mirrors this job step for step, so the minute spent here confirms a verdict rather
# than discovering one. `ready_for_review` is in the type list because it is not a
# default: without it, taking a PR out of draft would start no run at all.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Nothing in this org cancelled a superseded run before 2026-07-30; 218 min/week was
# spent finishing suites for commits that had already been replaced. Cancel on PRs, where
# only the latest push matters — but never on trunk, where each commit is a distinct
# thing someone may need a verdict about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: typecheck + unit
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      # @turnwrk/email is the second package in this repo (TURNWRK-221).
      - run: npm ci
        working-directory: email
      - run: npm run typecheck
        working-directory: email
      # Suite-local only: skips when sibling apps are absent (this repo CI).
      # Full shared + email + testFixtures parity (TURNWRK-134).
      - run: npm run check:vendored

  rules:
    name: firestore rules behavior tests
    # tests/rules/*.rules.test.ts are the ONLY behavior tests the canonical
    # firestore.rules has, and until TURNWRK-271 they ran nowhere: the unit job
    # excludes them (they need a live emulator, so they sit behind `test:rules`
    # + vitest.rules.config.ts) and no workflow called that script. Consumers
    # vendor these rules, so a regression here reaches four apps.
    # Deliberately NOT gated on `pull_request` the way dispatch's twin job is:
    # this repo lands straight on main for the sync bot to fan out, so a
    # PR-only gate would sit out most of the changes it exists to catch.
    needs: unit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Installs rules-test-deps' own firebase copy, then boots the firestore
      # emulator (firebase.json points it at firebase/firestore.rules) and runs
      # the suite. ubuntu-latest ships the JRE the emulator needs.
      - run: npm run test:rules
        env:
          CI: 'true'

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    # A public repo that asks people to trust it with commit access cannot leak a
    # credential into a merge. gitleaks runs on the checked-out working tree only
    # (`--no-git`): a fresh checkout carries just the tracked files — dist/ and
    # node_modules/ are gitignored and absent — so this scans exactly what a PR would
    # merge, without walking git history (which would re-flag anything ever committed
    # and can't be un-committed from a PR). Pinned to the gitleaks CLI, which is MIT and
    # free for org use; the paid gitleaks-action licence is deliberately not used.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          version=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan working tree
        run: gitleaks detect --no-git --redact --verbose --no-banner
